<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" role="img" aria-labelledby="search-journey-en-desktop-title search-journey-en-desktop-desc" lang="en">
<title id="search-journey-en-desktop-title">How search brings visitors</title>
<desc id="search-journey-en-desktop-desc">An example: a hypothetical meditation timer。 A real need → A search → A result appears → A page visit → A task completed. One possible path. People can stop at any step. Accessible ≠ indexed; Shown ≠ clicked</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#58635D" stroke-width="1.3"/></marker></defs>
<rect width="1100" height="440" fill="#F5F6F2"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif">
<text x="38" y="48" font-size="29" font-weight="650" fill="#161C1A" text-anchor="start">How search brings visitors</text>
<text x="38" y="76" font-size="14" font-weight="400" fill="#58635D" text-anchor="start">An example: a hypothetical meditation timer</text>
<text x="1062" y="46" font-size="11" font-weight="550" fill="#58635D" text-anchor="end">01 / SEARCH JOURNEY</text>
<path d="M38 98H1062" stroke="#BBC4B9"/>
<g id="node-need" data-node-id="need">
<text x="130" y="129" font-size="11" font-weight="550" fill="#58635D" text-anchor="middle">01</text>
<circle cx="130" cy="191" r="47" fill="#E8ECE3"/>
<g transform="translate(130 191) scale(1)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-13" r="11"/><path d="M-23 25c0-24 46-24 46 0"/><path d="M22-25h27v22H35l-8 8v-8h-5z"/><path d="M29-17h13M29-11h8"/></g>
<text x="130" y="274" font-size="19" font-weight="650" fill="#161C1A" text-anchor="middle">A real need</text>
<text x="130" y="302" font-size="12" font-weight="400" fill="#58635D" text-anchor="middle">“I want 5 quiet minutes.”</text>
</g>
<path d="M187 191h95" fill="none" stroke="#58635D" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<g id="node-search" data-node-id="search">
<text x="340" y="129" font-size="11" font-weight="550" fill="#58635D" text-anchor="middle">02</text>
<circle cx="340" cy="191" r="47" fill="#E8ECE3"/>
<g transform="translate(340 191) scale(1)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-40" y="-17" width="80" height="34" rx="17"/><circle cx="-20" cy="-2" r="7"/><path d="m-15 3 7 7M2-2h25"/></g>
<text x="340" y="274" font-size="19" font-weight="650" fill="#161C1A" text-anchor="middle">A search</text>
<text x="340" y="302" font-size="12" font-weight="400" fill="#58635D" text-anchor="middle">“meditation timer no download”</text>
</g>
<path d="M397 191h95" fill="none" stroke="#58635D" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<g id="node-result" data-node-id="result">
<text x="550" y="129" font-size="11" font-weight="550" fill="#58635D" text-anchor="middle">03</text>
<circle cx="550" cy="191" r="47" fill="#E8ECE3"/>
<g transform="translate(550 191) scale(1)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-34-30h68v61h-68zM-34-14h68"/><path d="M-23-22h1M-16-22h1M-9-22h1M-23-2h44M-23 8h31M-23 21h44"/></g>
<text x="550" y="274" font-size="19" font-weight="650" fill="#161C1A" text-anchor="middle">A result appears</text>
<text x="550" y="302" font-size="12" font-weight="400" fill="#58635D" text-anchor="middle">Your page may be shown</text>
</g>
<path d="M607 191h95" fill="none" stroke="#58635D" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<g id="node-visit" data-node-id="visit">
<text x="760" y="129" font-size="11" font-weight="550" fill="#58635D" text-anchor="middle">04</text>
<circle cx="760" cy="191" r="47" fill="#E8ECE3"/>
<g transform="translate(760 191) scale(1)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-35-30h70v61h-70zM-35-14h70M-24-22h1M-17-22h1M-10-22h1"/><path d="M-20-2H6M-20 7H1"/><path fill="#D7FA64" d="m12 3 22 13-11 3-5 12z"/></g>
<text x="760" y="274" font-size="19" font-weight="650" fill="#161C1A" text-anchor="middle">A page visit</text>
<text x="760" y="302" font-size="12" font-weight="400" fill="#58635D" text-anchor="middle">A good fit may earn a click</text>
</g>
<path d="M817 191h95" fill="none" stroke="#58635D" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<g id="node-finish" data-node-id="finish">
<text x="970" y="129" font-size="11" font-weight="550" fill="#58635D" text-anchor="middle">05</text>
<circle cx="970" cy="191" r="47" fill="#D7FA64"/>
<g transform="translate(970 191) scale(1)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="31"/><path d="M-7-39H7M0-39v8M0-23v23l13 8"/><path d="m14 26 8 8 16-20" stroke-width="3"/></g>
<text x="970" y="274" font-size="19" font-weight="650" fill="#161C1A" text-anchor="middle">A task completed</text>
<text x="970" y="302" font-size="12" font-weight="400" fill="#58635D" text-anchor="middle">The 5-minute timer works</text>
</g>
<path d="M38 337H1062" stroke="#BBC4B9"/>
<text x="38" y="373" font-size="14" font-weight="500" fill="#161C1A" text-anchor="start">One possible path. People can stop at any step.</text>
<text x="38" y="409" font-size="10" font-weight="550" fill="#58635D" text-anchor="start">AWESOME SEO WORKFLOW</text>
<text x="1057" y="372" font-size="14" font-weight="550" fill="#161C1A" text-anchor="end">Accessible ≠ indexed</text>
<text x="1057" y="404" font-size="14" font-weight="550" fill="#161C1A" text-anchor="end">Shown ≠ clicked</text>
</g></svg>