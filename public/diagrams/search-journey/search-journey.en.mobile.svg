<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 750" role="img" aria-labelledby="search-journey-en-mobile-title search-journey-en-mobile-desc" lang="en">
<title id="search-journey-en-mobile-title">How search brings visitors</title>
<desc id="search-journey-en-mobile-desc">An example: a hypothetical meditation timer。 A real need → A search → A result appears → A page visit → A task completed. One possible path. People can stop at any step. Accessible ≠ indexed; Shown ≠ clicked</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#58635D" stroke-width="1.3"/></marker></defs>
<rect width="375" height="750" fill="#F5F6F2"/>
<g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif">
<text x="24" y="39" font-size="23" font-weight="650" fill="#161C1A" text-anchor="start">How search brings visitors</text>
<text x="24" y="65" font-size="12" font-weight="400" fill="#58635D" text-anchor="start">An example: a hypothetical meditation timer</text>
<path d="M24 84H351" stroke="#BBC4B9"/>
<g id="node-need" data-node-id="need">
<circle cx="68" cy="137" r="39" fill="#E8ECE3"/>
<g transform="translate(68 137) scale(0.66)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-13" r="11"/><path d="M-23 25c0-24 46-24 46 0"/><path d="M22-25h27v22H35l-8 8v-8h-5z"/><path d="M29-17h13M29-11h8"/></g>
<text x="122" y="120" font-size="11" font-weight="600" fill="#58635D" text-anchor="start">01</text>
<text x="122" y="144" font-size="18" font-weight="650" fill="#161C1A" text-anchor="start">A real need</text>
<text x="122" y="168" font-size="12" font-weight="400" fill="#58635D" text-anchor="start">“I want 5 quiet minutes.”</text>
</g>
<path d="M68 181v13" fill="none" stroke="#58635D" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<g id="node-search" data-node-id="search">
<circle cx="68" cy="237" r="39" fill="#E8ECE3"/>
<g transform="translate(68 237) scale(0.66)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-40" y="-17" width="80" height="34" rx="17"/><circle cx="-20" cy="-2" r="7"/><path d="m-15 3 7 7M2-2h25"/></g>
<text x="122" y="220" font-size="11" font-weight="600" fill="#58635D" text-anchor="start">02</text>
<text x="122" y="244" font-size="18" font-weight="650" fill="#161C1A" text-anchor="start">A search</text>
<text x="122" y="268" font-size="12" font-weight="400" fill="#58635D" text-anchor="start">“meditation timer no download”</text>
</g>
<path d="M68 281v13" fill="none" stroke="#58635D" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<g id="node-result" data-node-id="result">
<circle cx="68" cy="337" r="39" fill="#E8ECE3"/>
<g transform="translate(68 337) scale(0.66)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-34-30h68v61h-68zM-34-14h68"/><path d="M-23-22h1M-16-22h1M-9-22h1M-23-2h44M-23 8h31M-23 21h44"/></g>
<text x="122" y="320" font-size="11" font-weight="600" fill="#58635D" text-anchor="start">03</text>
<text x="122" y="344" font-size="18" font-weight="650" fill="#161C1A" text-anchor="start">A result appears</text>
<text x="122" y="368" font-size="12" font-weight="400" fill="#58635D" text-anchor="start">Your page may be shown</text>
</g>
<path d="M68 381v13" fill="none" stroke="#58635D" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<g id="node-visit" data-node-id="visit">
<circle cx="68" cy="437" r="39" fill="#E8ECE3"/>
<g transform="translate(68 437) scale(0.66)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-35-30h70v61h-70zM-35-14h70M-24-22h1M-17-22h1M-10-22h1"/><path d="M-20-2H6M-20 7H1"/><path fill="#D7FA64" d="m12 3 22 13-11 3-5 12z"/></g>
<text x="122" y="420" font-size="11" font-weight="600" fill="#58635D" text-anchor="start">04</text>
<text x="122" y="444" font-size="18" font-weight="650" fill="#161C1A" text-anchor="start">A page visit</text>
<text x="122" y="468" font-size="12" font-weight="400" fill="#58635D" text-anchor="start">A good fit may earn a click</text>
</g>
<path d="M68 481v13" fill="none" stroke="#58635D" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<g id="node-finish" data-node-id="finish">
<circle cx="68" cy="537" r="39" fill="#D7FA64"/>
<g transform="translate(68 537) scale(0.66)" fill="none" stroke="#161C1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="31"/><path d="M-7-39H7M0-39v8M0-23v23l13 8"/><path d="m14 26 8 8 16-20" stroke-width="3"/></g>
<text x="122" y="520" font-size="11" font-weight="600" fill="#58635D" text-anchor="start">05</text>
<text x="122" y="544" font-size="18" font-weight="650" fill="#161C1A" text-anchor="start">A task completed</text>
<text x="122" y="568" font-size="12" font-weight="400" fill="#58635D" text-anchor="start">The 5-minute timer works</text>
</g>
<path d="M24 599H351" stroke="#BBC4B9"/>
<text x="24" y="628" font-size="12" font-weight="500" fill="#161C1A" text-anchor="start">One possible path. People can stop at any step.</text>
<text x="24" y="667" font-size="15" font-weight="550" fill="#161C1A" text-anchor="start">Accessible ≠ indexed</text>
<text x="24" y="695" font-size="15" font-weight="550" fill="#161C1A" text-anchor="start">Shown ≠ clicked</text>
<text x="24" y="729" font-size="10" font-weight="550" fill="#58635D" text-anchor="start">AWESOME SEO WORKFLOW  /  01</text>
</g></svg>