<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 750" width="375" height="750" role="img" aria-labelledby="title desc"><title id="title">From a question to an evidence-based next step</title><desc id="desc">Agent does the work. Skill guides the steps. You stay in control.。Give a goal → Check the evidence → Bring back findings → You decide。SIMULATED EXAMPLE · NOT A LIVE CHECK。Known: the page opens。Unknown: search indexing has not been checked。No automatic publishing, editing, or permission bypass.</desc><rect width="375" height="750" fill="#F5F6F2"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif"><text x="22" y="32" font-size="22" font-weight="700" fill="#161C1A" text-anchor="start">From a question to an</text><text x="22" y="60" font-size="22" font-weight="700" fill="#161C1A" text-anchor="start">evidence-based next step</text><text x="22" y="87" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">Agent works. Skill guides. You decide.</text><line x1="36" y1="119" x2="36" y2="548" stroke="#B8C2B7" stroke-width="2" /><g id="step-1"><circle cx="36" cy="128" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="133" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">1</text><text x="63" y="134" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">Give a goal</text><rect x="63" y="148" width="287" height="34" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><text x="75" y="171" font-size="16" font-weight="500" fill="#161C1A" text-anchor="start">Your page URL</text><text x="63" y="206" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">Can search engines find this page?</text></g><g id="step-2"><circle cx="36" cy="248" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="253" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">2</text><text x="63" y="254" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">Check the evidence</text><rect x="63" y="268" width="245" height="37" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><text x="76" y="293" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">✓  Skill: check steps</text><circle cx="327" cy="287" r="16" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><line x1="338" y1="300" x2="347" y2="309" stroke="#161C1A" stroke-width="2" /><text x="63" y="328" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">Agent follows a Skill; checks results</text></g><g id="step-3"><circle cx="36" cy="368" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="373" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">3</text><text x="63" y="374" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">Bring back findings</text><rect x="63" y="388" width="6" height="58" rx="2" fill="#D7FA64" stroke="#D7FA64" stroke-width="1.5"/><text x="80" y="411" font-size="15" font-weight="600" fill="#161C1A" text-anchor="start">Separate known from unknown</text><text x="80" y="437" font-size="15" font-weight="400" fill="#56615B" text-anchor="start">and suggest a next step</text></g><g id="step-4"><circle cx="36" cy="488" r="14" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="493" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">4</text><text x="63" y="494" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">You decide</text><rect x="63" y="507" width="287" height="35" rx="8" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="206" y="531" font-size="17" font-weight="700" fill="#161C1A" text-anchor="middle">Your decision</text><text x="63" y="567" font-size="15" font-weight="400" fill="#56615B" text-anchor="start">Review evidence and advice</text></g><rect x="22" y="592" width="331" height="119" rx="8" fill="white" stroke="#B8C2B7" stroke-width="1.5"/><text x="35" y="611" font-size="10" font-weight="700" fill="#56615B" text-anchor="start">SIMULATED EXAMPLE · NOT A LIVE CHECK</text><text x="35" y="636" font-size="15" font-weight="600" fill="#161C1A" text-anchor="start">Known: the page opens</text><text x="35" y="659" font-size="14" font-weight="600" fill="#161C1A" text-anchor="start">Unknown: indexing is not yet checked</text><text x="35" y="685" font-size="13" font-weight="400" fill="#56615B" text-anchor="start">Next: check whether the page is indexed</text><text x="22" y="731" font-size="12" font-weight="400" fill="#56615B" text-anchor="start">No automatic publishing or editing.</text><text x="22" y="745" font-size="12" font-weight="400" fill="#56615B" text-anchor="start">No permission bypass.</text></g></svg>