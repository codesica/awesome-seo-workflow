<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="title desc"><title id="title">From a question to an evidence-based next step</title><desc id="desc">Agent does the work. Skill guides the steps. You stay in control.。Give a goal → Check the evidence → Bring back findings → You decide。SIMULATED EXAMPLE · NOT A LIVE CHECK。Known: the page opens。Unknown: search indexing has not been checked。No automatic publishing, editing, or permission bypass.</desc><rect width="1100" height="440" fill="#F5F6F2"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif"><text x="34" y="43" font-size="28" font-weight="700" fill="#161C1A" text-anchor="start">From a question to an evidence-based next step</text><text x="34" y="72" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">Agent does the work. Skill guides the steps. You stay in control.</text><line x1="34" y1="92" x2="1066" y2="92" stroke="#B8C2B7" stroke-width="1.5" /><line x1="48" y1="113" x2="843" y2="113" stroke="#B8C2B7" stroke-width="2" /><line x1="48" y1="113" x2="48" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-1"><circle cx="48" cy="141" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="48" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">1</text><text x="74" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">Give a goal</text><rect x="34" y="169" width="225" height="54" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><line x1="34" y1="186" x2="259" y2="186" stroke="#B8C2B7" stroke-width="1.5" /><circle cx="45" cy="178" r="2" fill="#161C1A" stroke="#161C1A" stroke-width="1.5"/><circle cx="54" cy="178" r="2" fill="#B8C2B7" stroke="#B8C2B7" stroke-width="1.5"/><text x="46" y="209" font-size="16" font-weight="500" fill="#161C1A" text-anchor="start">Your page URL</text><text x="34" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">Share a page URL</text><text x="34" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">and the question you have</text></g><text x="273" y="202" font-size="22" font-weight="400" fill="#56615B" text-anchor="start">→</text><line x1="313" y1="113" x2="313" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-2"><circle cx="313" cy="141" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="313" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">2</text><text x="339" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">Check the evidence</text><rect x="299" y="165" width="207" height="62" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><text x="311" y="185" font-size="15" font-weight="600" fill="#161C1A" text-anchor="start">Skill: check steps</text><line x1="333" y1="201" x2="444" y2="201" stroke="#B8C2B7" stroke-width="1.5" /><line x1="333" y1="215" x2="425" y2="215" stroke="#B8C2B7" stroke-width="1.5" /><text x="311" y="206" font-size="17" font-weight="400" fill="#161C1A" text-anchor="start">✓</text><text x="311" y="220" font-size="17" font-weight="400" fill="#161C1A" text-anchor="start">✓</text><circle cx="505" cy="211" r="18" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><line x1="517" y1="224" x2="530" y2="237" stroke="#161C1A" stroke-width="3" /><text x="299" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">Agent follows a Skill</text><text x="299" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">and checks the results</text></g><text x="538" y="202" font-size="22" font-weight="400" fill="#56615B" text-anchor="start">→</text><line x1="578" y1="113" x2="578" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-3"><circle cx="578" cy="141" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="578" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">3</text><text x="604" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">Bring back findings</text><rect x="564" y="168" width="225" height="57" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><rect x="576" y="179" width="6" height="34" rx="2" fill="#D7FA64" stroke="#D7FA64" stroke-width="1.5"/><text x="592" y="191" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">Findings + next step</text><line x1="592" y1="207" x2="761" y2="207" stroke="#B8C2B7" stroke-width="1.5" /><text x="564" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">Separate known from unknown</text><text x="564" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">and suggest a next step</text></g><text x="803" y="202" font-size="22" font-weight="400" fill="#56615B" text-anchor="start">→</text><line x1="843" y1="113" x2="843" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-4"><circle cx="843" cy="141" r="14" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="843" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">4</text><text x="869" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">You decide</text><rect x="829" y="169" width="225" height="54" rx="8" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="941" y="202" font-size="19" font-weight="700" fill="#161C1A" text-anchor="middle">Your review</text><text x="829" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">Review evidence and advice</text><text x="829" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">before approving any action</text></g><rect x="34" y="305" width="1032" height="87" rx="8" fill="white" stroke="#B8C2B7" stroke-width="1.5"/><text x="50" y="326" font-size="12" font-weight="700" fill="#56615B" text-anchor="start">SIMULATED EXAMPLE · NOT A LIVE CHECK</text><circle cx="57" cy="350" r="6" fill="#D7FA64" stroke="#D7FA64" stroke-width="1.5"/><text x="71" y="356" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">Known: the page opens</text><text x="340" y="356" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">Unknown: search indexing has not been checked</text><text x="50" y="380" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">Next: check whether the page is indexed</text><text x="34" y="419" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">No automatic publishing, editing, or permission bypass.</text></g></svg>