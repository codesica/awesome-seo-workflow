<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 750" width="375" height="750" role="img" aria-labelledby="title desc"><title id="title">从一个问题，到有依据的下一步</title><desc id="desc">Agent 帮你执行 · Skill 提供步骤 · 决定权在你。给出目标 → 按步骤查证 → 带回发现 → 由你做决定。模拟例子 · 不是实际检查结果。已知：页面能打开。待查：搜索能否收录尚未检查。不会自动发布或修改，也不绕过权限。</desc><rect width="375" height="750" fill="#F5F6F2"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif"><text x="22" y="34" font-size="24" font-weight="700" fill="#161C1A" text-anchor="start">从一个问题，</text><text x="22" y="64" font-size="24" font-weight="700" fill="#161C1A" text-anchor="start">到有依据的下一步</text><text x="22" y="90" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">Agent 执行 · Skill 引路 · 你来决定</text><line x1="36" y1="119" x2="36" y2="548" stroke="#B8C2B7" stroke-width="2" /><g id="step-1"><circle cx="36" cy="128" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="133" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">1</text><text x="63" y="134" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">给出目标</text><rect x="63" y="148" width="287" height="34" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><text x="75" y="171" font-size="16" font-weight="500" fill="#161C1A" text-anchor="start">你的网页地址</text><text x="63" y="206" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">这个页面能被搜索到吗？</text></g><g id="step-2"><circle cx="36" cy="248" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="253" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">2</text><text x="63" y="254" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">按步骤查证</text><rect x="63" y="268" width="245" height="37" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><text x="76" y="293" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">✓  Skill：检查步骤</text><circle cx="327" cy="287" r="16" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><line x1="338" y1="300" x2="347" y2="309" stroke="#161C1A" stroke-width="2" /><text x="63" y="328" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">Agent 按 Skill 操作，保留依据</text></g><g id="step-3"><circle cx="36" cy="368" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="373" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">3</text><text x="63" y="374" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">带回发现</text><rect x="63" y="388" width="6" height="58" rx="2" fill="#D7FA64" stroke="#D7FA64" stroke-width="1.5"/><text x="80" y="411" font-size="15" font-weight="600" fill="#161C1A" text-anchor="start">说明已知和未知</text><text x="80" y="437" font-size="15" font-weight="400" fill="#56615B" text-anchor="start">给出建议的下一步</text></g><g id="step-4"><circle cx="36" cy="488" r="14" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="36" y="493" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">4</text><text x="63" y="494" font-size="20" font-weight="700" fill="#161C1A" text-anchor="start">由你做决定</text><rect x="63" y="507" width="287" height="35" rx="8" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="206" y="531" font-size="17" font-weight="700" fill="#161C1A" text-anchor="middle">等你决定</text><text x="63" y="567" font-size="15" font-weight="400" fill="#56615B" text-anchor="start">先核对证据与建议</text></g><rect x="22" y="592" width="331" height="119" rx="8" fill="white" stroke="#B8C2B7" stroke-width="1.5"/><text x="35" y="614" font-size="12" font-weight="700" fill="#56615B" text-anchor="start">模拟例子 · 不是实际检查结果</text><text x="35" y="642" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">已知：页面能打开</text><text x="35" y="667" font-size="15" font-weight="600" fill="#161C1A" text-anchor="start">待查：搜索能否收录尚未检查</text><text x="35" y="694" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">下一步：检查搜索引擎收录情况</text><text x="22" y="737" font-size="13" font-weight="400" fill="#56615B" text-anchor="start">不会自动发布或修改，也不绕过权限。</text></g></svg>