<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="title desc"><title id="title">从一个问题，到有依据的下一步</title><desc id="desc">Agent 帮你执行 · Skill 提供步骤 · 决定权在你。给出目标 → 按步骤查证 → 带回发现 → 由你做决定。模拟例子 · 不是实际检查结果。已知：页面能打开。待查：搜索能否收录尚未检查。不会自动发布或修改，也不绕过权限。</desc><rect width="1100" height="440" fill="#F5F6F2"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans CJK SC, sans-serif"><text x="34" y="43" font-size="28" font-weight="700" fill="#161C1A" text-anchor="start">从一个问题，到有依据的下一步</text><text x="34" y="72" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">Agent 帮你执行 · Skill 提供步骤 · 决定权在你</text><line x1="34" y1="92" x2="1066" y2="92" stroke="#B8C2B7" stroke-width="1.5" /><line x1="48" y1="113" x2="843" y2="113" stroke="#B8C2B7" stroke-width="2" /><line x1="48" y1="113" x2="48" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-1"><circle cx="48" cy="141" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="48" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">1</text><text x="74" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">给出目标</text><rect x="34" y="169" width="225" height="54" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><line x1="34" y1="186" x2="259" y2="186" stroke="#B8C2B7" stroke-width="1.5" /><circle cx="45" cy="178" r="2" fill="#161C1A" stroke="#161C1A" stroke-width="1.5"/><circle cx="54" cy="178" r="2" fill="#B8C2B7" stroke="#B8C2B7" stroke-width="1.5"/><text x="46" y="209" font-size="16" font-weight="500" fill="#161C1A" text-anchor="start">你的网页地址</text><text x="34" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">一个网页地址</text><text x="34" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">加上你想解决的问题</text></g><text x="273" y="202" font-size="22" font-weight="400" fill="#56615B" text-anchor="start">→</text><line x1="313" y1="113" x2="313" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-2"><circle cx="313" cy="141" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="313" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">2</text><text x="339" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">按步骤查证</text><rect x="299" y="165" width="207" height="62" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><text x="311" y="185" font-size="15" font-weight="600" fill="#161C1A" text-anchor="start">Skill：检查步骤</text><line x1="333" y1="201" x2="444" y2="201" stroke="#B8C2B7" stroke-width="1.5" /><line x1="333" y1="215" x2="425" y2="215" stroke="#B8C2B7" stroke-width="1.5" /><text x="311" y="206" font-size="17" font-weight="400" fill="#161C1A" text-anchor="start">✓</text><text x="311" y="220" font-size="17" font-weight="400" fill="#161C1A" text-anchor="start">✓</text><circle cx="505" cy="211" r="18" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><line x1="517" y1="224" x2="530" y2="237" stroke="#161C1A" stroke-width="3" /><text x="299" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">Agent 参考 Skill 操作</text><text x="299" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">查看结果，保留依据</text></g><text x="538" y="202" font-size="22" font-weight="400" fill="#56615B" text-anchor="start">→</text><line x1="578" y1="113" x2="578" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-3"><circle cx="578" cy="141" r="14" fill="#F5F6F2" stroke="#161C1A" stroke-width="1.5"/><text x="578" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">3</text><text x="604" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">带回发现</text><rect x="564" y="168" width="225" height="57" rx="8" fill="white" stroke="#161C1A" stroke-width="1.5"/><rect x="576" y="179" width="6" height="34" rx="2" fill="#D7FA64" stroke="#D7FA64" stroke-width="1.5"/><text x="592" y="191" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">发现 + 下一步</text><line x1="592" y1="207" x2="761" y2="207" stroke="#B8C2B7" stroke-width="1.5" /><text x="564" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">说明已知和未知</text><text x="564" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">给出建议的下一步</text></g><text x="803" y="202" font-size="22" font-weight="400" fill="#56615B" text-anchor="start">→</text><line x1="843" y1="113" x2="843" y2="127" stroke="#B8C2B7" stroke-width="1.5" /><g id="step-4"><circle cx="843" cy="141" r="14" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="843" y="146" font-size="14" font-weight="700" fill="#161C1A" text-anchor="middle">4</text><text x="869" y="148" font-size="18" font-weight="700" fill="#161C1A" text-anchor="start">由你做决定</text><rect x="829" y="169" width="225" height="54" rx="8" fill="#D7FA64" stroke="#161C1A" stroke-width="1.5"/><text x="941" y="202" font-size="19" font-weight="700" fill="#161C1A" text-anchor="middle">你来核对</text><text x="829" y="254" font-size="16" font-weight="400" fill="#161C1A" text-anchor="start">先核对证据与建议</text><text x="829" y="277" font-size="16" font-weight="400" fill="#56615B" text-anchor="start">再决定是否执行</text></g><rect x="34" y="305" width="1032" height="87" rx="8" fill="white" stroke="#B8C2B7" stroke-width="1.5"/><text x="50" y="326" font-size="12" font-weight="700" fill="#56615B" text-anchor="start">模拟例子 · 不是实际检查结果</text><circle cx="57" cy="350" r="6" fill="#D7FA64" stroke="#D7FA64" stroke-width="1.5"/><text x="71" y="356" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">已知：页面能打开</text><text x="340" y="356" font-size="16" font-weight="600" fill="#161C1A" text-anchor="start">待查：搜索能否收录尚未检查</text><text x="50" y="380" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">下一步：检查搜索引擎收录情况</text><text x="34" y="419" font-size="14" font-weight="400" fill="#56615B" text-anchor="start">不会自动发布或修改，也不绕过权限。</text></g></svg>