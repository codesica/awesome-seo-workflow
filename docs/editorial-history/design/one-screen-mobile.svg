<svg xmlns="http://www.w3.org/2000/svg" width="375" height="940" viewBox="0 0 375 940"><rect width="375" height="940" fill="#F8FAFC"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,sans-serif" fill="#1B2537"><text x="20" y="37" font-size="15" font-weight="600" fill="#1B2537">Awesome SEO Workflow</text><text x="287" y="37" font-size="13" font-weight="600" fill="#1B2537">中 / EN</text><path d="M20 60 L355 60" stroke="#DDE4ED" stroke-width="1" fill="none" stroke-linecap="round"/><text x="20" y="98" font-size="13" font-weight="600" fill="#58677C">第一堂 · 看懂搜索结果</text><text x="20" y="143" font-size="32" font-weight="600" fill="#1B2537">一张网页，怎样</text><text x="20" y="185" font-size="32" font-weight="600" fill="#1B2537">被需要的人找到？</text><text x="20" y="223" font-size="16" font-weight="400" fill="#1B2537">不用先记术语。看懂一条搜索结果，</text><text x="20" y="251" font-size="16" font-weight="400" fill="#1B2537">再给自己的网页改好一个标题。</text><rect x="20" y="273" width="207" height="46" rx="8" fill="#315ECC"/><text x="40" y="303" font-size="17" font-weight="600" fill="#FFFFFF">看一遍，再自己做</text><rect x="20" y="345" width="335" height="430" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/><text x="36" y="377" font-size="16" font-weight="600" fill="#1B2537">一个问题，一张可能帮忙的页面</text><rect x="36" y="397" width="303" height="44" rx="8" fill="#F8FAFC"/><text x="52" y="426" font-size="16" font-weight="600" fill="#1B2537">五分钟冥想计时</text><text x="36" y="467" font-size="14" font-weight="400" fill="#58677C">这个人想完成的事</text><path d="M36 476 L172 476" stroke="#315ECC" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="36" y="496" width="83" height="32" rx="8" fill="#F8FAFC"/><text x="52" y="518" font-size="14" font-weight="600" fill="#58677C">修改前</text><rect x="129" y="496" width="89" height="32" rx="8" fill="#EAF0FF"/><text x="145" y="518" font-size="14" font-weight="600" fill="#315ECC">修改后</text><text x="36" y="559" font-size="13" font-weight="400" fill="#58677C">example.com/timer</text><text x="36" y="591" font-size="20" font-weight="600" fill="#315ECC">五分钟冥想计时：</text><text x="36" y="619" font-size="20" font-weight="600" fill="#315ECC">打开就开始</text><text x="36" y="653" font-size="16" font-weight="400" fill="#1B2537">设置五分钟，跟随提示开始。</text><path d="M36 677 L339 677" stroke="#DDE4ED" stroke-width="1" fill="none" stroke-linecap="round"/><text x="36" y="706" font-size="15" font-weight="600" fill="#1B2537">标题告诉人：这页能帮什么忙？</text><text x="36" y="736" font-size="13" font-weight="400" fill="#58677C">概念示意，非实时搜索。</text><text x="36" y="757" font-size="13" font-weight="400" fill="#58677C">排名、收录未知。</text><text x="20" y="824" font-size="19" font-weight="600" fill="#1B2537">现在，改好你自己的一句标题。</text><text x="20" y="856" font-size="15" font-weight="400" fill="#58677C">留下一句话和理由；不需要账号。</text><text x="20" y="915" font-size="12" font-weight="400" fill="#58677C">静态构图提案 · 375px · 等一屏确认</text></g></svg>