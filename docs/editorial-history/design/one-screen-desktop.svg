<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#F8FAFC"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,sans-serif" fill="#1B2537"><text x="160" y="50" font-size="17" font-weight="600" fill="#1B2537">Awesome SEO Workflow</text><text x="994" y="50" font-size="15" font-weight="400" fill="#1B2537">课程</text><text x="1062" y="50" font-size="15" font-weight="400" fill="#1B2537">Skills</text><text x="1150" y="50" font-size="15" font-weight="600" fill="#1B2537">中文 / EN</text><path d="M160 78 L1280 78" stroke="#DDE4ED" stroke-width="1" fill="none" stroke-linecap="round"/><text x="160" y="166" font-size="14" font-weight="600" fill="#58677C">第一堂 · 看懂搜索结果</text><text x="160" y="238" font-size="52" font-weight="600" fill="#1B2537">一张网页，怎样</text><text x="160" y="300" font-size="52" font-weight="600" fill="#1B2537">被需要的人找到？</text><text x="160" y="359" font-size="18" font-weight="400" fill="#1B2537">不用先记术语。看懂一条搜索结果，</text><text x="160" y="390" font-size="18" font-weight="400" fill="#1B2537">再给自己的网页改好一个标题。</text><rect x="160" y="436" width="224" height="52" rx="8" fill="#315ECC"/><text x="184" y="469" font-size="18" font-weight="600" fill="#FFFFFF">看一遍，再自己做</text><text x="160" y="535" font-size="16" font-weight="400" fill="#58677C">这一课留下：一句标题 + 一个理由。</text><text x="160" y="566" font-size="14" font-weight="400" fill="#58677C">约 5 分钟 · 不需要账号</text><rect x="680" y="142" width="600" height="508" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/><text x="708" y="180" font-size="18" font-weight="600" fill="#1B2537">一个人提问，一张可能帮忙的页面</text><rect x="708" y="204" width="542" height="54" rx="8" fill="#F8FAFC"/><text x="730" y="237" font-size="18" font-weight="600" fill="#1B2537">五分钟冥想计时</text><text x="708" y="292" font-size="14" font-weight="400" fill="#58677C">这个人想完成的事</text><path d="M708 301 L879 301" stroke="#315ECC" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="708" y="325" width="94" height="34" rx="8" fill="#F8FAFC"/><text x="730" y="348" font-size="14" font-weight="600" fill="#58677C">修改前</text><rect x="812" y="325" width="104" height="34" rx="8" fill="#EAF0FF"/><text x="834" y="348" font-size="14" font-weight="600" fill="#315ECC">修改后</text><text x="708" y="406" font-size="14" font-weight="400" fill="#58677C">example.com/timer</text><text x="708" y="444" font-size="23" font-weight="600" fill="#315ECC">五分钟冥想计时：打开就开始</text><path d="M708 454 L1080 454" stroke="#315ECC" stroke-width="2" fill="none" stroke-linecap="round"/><text x="708" y="492" font-size="16" font-weight="400" fill="#1B2537">设置五分钟，跟随提示开始。适合第一次</text><text x="708" y="519" font-size="16" font-weight="400" fill="#1B2537">想试试短时冥想的人。</text><path d="M708 551 L1252 551" stroke="#DDE4ED" stroke-width="1" fill="none" stroke-linecap="round"/><text x="708" y="585" font-size="16" font-weight="600" fill="#1B2537">标题让人判断：这页能帮我做什么？</text><text x="708" y="618" font-size="14" font-weight="400" fill="#58677C">概念示意；没有实时搜索。排名、收录未知。</text><path d="M160 718 L1280 718" stroke="#DDE4ED" stroke-width="1" fill="none" stroke-linecap="round"/><text x="160" y="760" font-size="24" font-weight="600" fill="#1B2537">接下来，只改你自己的一句标题。</text><text x="160" y="802" font-size="16" font-weight="400" fill="#58677C">问题 → 一个可观察的变化 → 自己留下一份记录</text><text x="1070" y="780" font-size="16" font-weight="600" fill="#315ECC">查看六堂课 →</text><text x="160" y="862" font-size="13" font-weight="400" fill="#58677C">原创一屏构图提案 / 静态线框：字体、比例和对象关系待确认，不是已发布页面。</text></g></svg>